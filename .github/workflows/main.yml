name: Sync to Google Drive

on:
  push:
    branches:
      - main

jobs:
  sync-gdrive:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出完整 Git 歷史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 壓縮 .git 內部碎片檔案 (提升 Google Drive 同步速度)
        run: |
          git gc --prune=now

      - name: 安裝 rclone
        run: sudo apt-get install -y rclone

      - name: 配置 Google Drive 連線
        env:
          GDRIVE_CRED: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: |
          # 透過環境變數寫入檔案，完整保留 JSON 原始雙引號格式
          echo "$GDRIVE_CRED" > /tmp/sa.json
          
          # 建立名為 gdrive 的 rclone 遠端配置
          rclone config create gdrive drive \
            scope=drive \
            service_account_file=/tmp/sa.json \
            root_folder_id=${{ secrets.GDRIVE_FOLDER_ID }}

      - name: 增量同步檔案到 Google Drive
        run: |
          # rclone sync 會增量比對，只更新有變動的檔案（diff）
          # 同步包含完整 .git 歷史，排除 .github workflow 本身
          rclone sync . gdrive: \
            --fast-list \
            --drive-use-trash=false \
            --exclude ".github/**" \
            -v

      - name: 清理憑證檔
        if: always()
        run: rm -f /tmp/sa.json
